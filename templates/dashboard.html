<!doctype html><html><body style="font-family:Arial;max-width:900px;margin:20px auto">
<h2>Admin Dashboard</h2><a href=/logout>Logout</a>{% if current_user.is_admin %}<h3>Create Scanner</h3><form action=/user method=post><input name=u placeholder=Username><input name=p placeholder=Password><button>Create</button></form><table border=1 cellpadding=5><tr><th>User</th><th>Status</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td><a href=/toggle/{{u.id}}>{{"Active" if u.active else "Revoked"}}</a></td></tr>{% endfor %}</table>{% endif %}<h3>Registered Teams</h3><table border=1 cellpadding=5><tr><th>QR</th><th>Team</th><th>Track</th></tr>{% for t in teams %}<tr><td><a href=/scan/{{t.qr_code}}>{{t.qr_code}}</a></td><td>{{t.team_name or "-"}}</td><td>{{t.track or "-"}}</td></tr>{% endfor %}</table></body></html>
